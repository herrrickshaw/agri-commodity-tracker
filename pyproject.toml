[project]
name = "agri-commodity-tracker"
version = "0.1.0"
description = "Daily India APMC mandi prices, World Bank agriculture panel and FCI depot directory — open-source collectors + DuckDB store"
requires-python = ">=3.9"
dependencies = ["duckdb>=0.9", "pycryptodome>=3.19"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["notebooks", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP015"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
